# Runs the same create -> verify -> destroy a reviewer runs locally. CI is
# evidence, not the entry point: `make verify` on a warm local cluster is.
name: verify
on:
  push:
    paths: ['slice/**', '.github/workflows/verify.yml']
  pull_request:
    paths: ['slice/**', '.github/workflows/verify.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: slice
    steps:
      - uses: actions/checkout@v5

      - name: Install k3d v5.8.3 (pinned release binary, no install script)
        run: |
          sudo curl -sfLo /usr/local/bin/k3d \
            https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          sudo chmod +x /usr/local/bin/k3d
          k3d version; kubectl version --client; helm version --short

      - name: Render every tenant spec (schema gate, no cluster)
        run: make render

      - name: Create
        run: make create

      - name: Verify
        run: make verify

      - name: Diagnostics on failure
        if: failure()
        run: |
          export KUBECONFIG=$HOME/.kube/k3d-gpu-slice.yaml
          kubectl get nodes -o wide || true
          kubectl describe nodes | grep -A12 '^Conditions' || true
          kubectl get pods -A -o wide || true
          nproc; free -m; sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches
          docker ps -a --format '{{.Names}} {{.Status}}'
          docker inspect k3d-gpu-slice-agent-1 --format 'agent-1 OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' || true
          docker exec k3d-gpu-slice-agent-1 sh -c 'free -m; ps aux | head -20' || true
          for n in agent-1 server-0; do
            echo "--- k3d-gpu-slice-$n (last 40 lines)"; docker logs k3d-gpu-slice-$n 2>&1 | tail -40
          done

      - name: Destroy
        if: always()
        run: make destroy
