# Teams run their own workloads. They can read their quota and events (so a
# rejected or queued request explains itself) but cannot change quota, network
# policy, RBAC or the namespace, and hold no cluster-scoped rights at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-developer
  namespace: {{ .Values.name }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [resourcequotas, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-developer
  namespace: {{ .Values.name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-developer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-sa
    namespace: {{ .Values.name }}
