# networkIsolation: namespace. Selecting every pod makes ingress default-deny;
# the one rule admits traffic from pods in this namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-isolation
  namespace: {{ .Values.name }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
