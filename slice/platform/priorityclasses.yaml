# The two tiers a tenant spec can name. Tenants never reference these names in
# their spec; chart/templates/_helpers.tpl maps tier -> class. Cluster-scoped and
# platform-owned: no tenant Role grants anything on priorityclasses.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tenant-low
value: 100
description: "Tenant tier low: queues under contention and is preempted by tier high."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tenant-high
value: 1000
preemptionPolicy: PreemptLowerPriority
description: "Tenant tier high: preempts tier low when capacity is short."
